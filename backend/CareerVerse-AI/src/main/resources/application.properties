spring.application.name=CareerVerse-AI
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/AIInterview?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration


# AWS S3 image storage
aws.region=us-east-1
aws.access.key=${AWS_ACCESS_KEY_ID:}
aws.secret.key=${AWS_SECRET_ACCESS_KEY:}

gemini.api-key=${GEMINI_API_KEY:${Gemini_API_Key:}}
gemini.model=gemini-1.5-flash

jwt.secret=${JWT_SECRET:careerverse-dev-secret-key-change-this-value-before-production}
jwt.expiration-ms=86400000
